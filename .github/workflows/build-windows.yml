name: Build InventoryApp for Windows 7 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'

      - name: Install compatible PyInstaller
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "pyinstaller==5.13.2"

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name InventoryApp inventory_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-Windows-32bit
          path: dist/InventoryApp.exe
          if-no-files-found: error
